name: Fix browser title once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update browser title
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = "<title>ゲームUIプロンプト生成ツール v1.52</title>"
          new = "<title>ゲームUIプロンプト生成ツール v1.58</title>"

          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one old title, found {text.count(old)}")

          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Commit change and remove one-time workflow
        run: |
          rm .github/workflows/fix-title-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-title-once.yml
          git commit -m "v1.58: Sync browser title"
          git push
